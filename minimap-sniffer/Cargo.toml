[package]
name = "darkdec-minimap-sniffer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
default-run = "darkdec-egui-minimap"

[features]
default = ["live-pcap", "egui"]
egui = ["dep:eframe"]
live-pcap = ["dep:pcap"]

[dependencies]
eframe = { version = "0.34.2", default-features = false, features = ["glow", "default_fonts"], optional = true }
pcap = { version = "2.4", optional = true }

[[bin]]
name = "darkdec-minimap-web"
path = "src/main.rs"

[[bin]]
name = "darkdec-egui-minimap"
path = "src/bin/egui_minimap.rs"
required-features = ["egui"]
