<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark December Minimap</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0e12;
      --panel: #171c22;
      --line: #2c3540;
      --text: #eef3f7;
      --muted: #9faab5;
      --player: #51b7ff;
      --entity: #ff675f;
      --stale: #777f89;
      --grid: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .shell {
      display: grid;
      grid-template-rows: 48px minmax(0, 1fr) 54px;
      height: 100vh;
    }

    header,
    footer {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 16px;
      background: var(--panel);
      border-color: var(--line);
      min-width: 0;
    }

    header {
      border-bottom: 1px solid var(--line);
    }

    footer {
      border-top: 1px solid var(--line);
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status {
      display: flex;
      gap: 12px;
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f5b84b;
      box-shadow: 0 0 0 4px rgba(245, 184, 75, 0.12);
      flex: 0 0 auto;
    }

    .dot.live {
      background: #55d187;
      box-shadow: 0 0 0 4px rgba(85, 209, 135, 0.14);
    }

    main {
      min-height: 0;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0d1116;
    }

    .legend {
      position: absolute;
      top: 12px;
      right: 12px;
      display: grid;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(15, 18, 23, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      pointer-events: none;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    button {
      width: 38px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      background: #222a32;
      color: var(--text);
      border-radius: 7px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      border-color: #4d5b69;
      background: #29323c;
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--player);
    }

    .spacer {
      flex: 1 1 auto;
      min-width: 12px;
    }

    .readout {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      .shell {
        grid-template-rows: 44px minmax(0, 1fr) 92px;
      }

      header,
      footer {
        padding: 0 10px;
      }

      footer {
        flex-wrap: wrap;
        align-content: center;
        gap: 10px;
      }

      .legend {
        left: 10px;
        right: auto;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <span id="liveDot" class="dot"></span>
      <span class="brand">Dark December Minimap</span>
      <span id="status" class="status">waiting</span>
    </header>
    <main>
      <canvas id="map"></canvas>
      <div class="legend">
        <span><i class="swatch" style="background: var(--player)"></i>Player</span>
        <span><i class="swatch" style="background: var(--entity)"></i>Active</span>
        <span><i class="swatch" style="background: var(--stale)"></i>Stale</span>
      </div>
    </main>
    <footer>
      <button id="centerBtn" title="Center on player">C</button>
      <button id="clearBtn" title="Clear trails">X</button>
      <label><input id="follow" type="checkbox" checked>Follow</label>
      <label><input id="trails" type="checkbox" checked>Trails</label>
      <span class="spacer"></span>
      <span id="readout" class="readout">0 entities</span>
    </footer>
  </div>
  <script>
    const canvas = document.getElementById("map");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const readoutEl = document.getElementById("readout");
    const liveDot = document.getElementById("liveDot");
    const followEl = document.getElementById("follow");
    const trailsEl = document.getElementById("trails");
    const centerBtn = document.getElementById("centerBtn");
    const clearBtn = document.getElementById("clearBtn");

    const world = {
      player: null,
      entities: new Map(),
      playerTrail: [],
      entityTrails: new Map(),
      stats: {},
      lastEventAt: 0,
      center: { x: 0, z: 0 },
      scale: 0.22
    };

    centerBtn.onclick = () => {
      if (world.player) {
        world.center.x = world.player.x;
        world.center.z = world.player.z;
        draw();
      }
    };

    clearBtn.onclick = () => {
      world.playerTrail.length = 0;
      world.entityTrails.clear();
      draw();
    };

    function resize() {
      const ratio = devicePixelRatio || 1;
      const box = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(box.width * ratio));
      canvas.height = Math.max(1, Math.floor(box.height * ratio));
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      draw();
    }

    function pushTrail(list, point, max) {
      list.push({ x: point.x, z: point.z, t: point.t });
      if (list.length > max) list.splice(0, list.length - max);
    }

    function applySnapshot(data) {
      world.player = data.player;
      world.entities.clear();
      world.entityTrails.clear();
      for (const entity of data.entities || []) {
        world.entities.set(entity.id, entity);
        world.entityTrails.set(entity.id, [{ x: entity.x, z: entity.z, t: entity.t }]);
      }
      world.stats = data.stats || {};
      if (world.player) {
        world.center.x = world.player.x;
        world.center.z = world.player.z;
        world.playerTrail = [{ x: world.player.x, z: world.player.z, t: world.player.t }];
      }
      draw();
    }

    function applyEvent(data) {
      world.lastEventAt = performance.now();
      liveDot.classList.add("live");
      if (data.stats) world.stats = data.stats;
      if (data.type === "player") {
        world.player = data;
        pushTrail(world.playerTrail, data, 2000);
        if (followEl.checked) {
          world.center.x = data.x;
          world.center.z = data.z;
        }
      } else if (data.type === "entity") {
        world.entities.set(data.id, data);
        if (!world.entityTrails.has(data.id)) world.entityTrails.set(data.id, []);
        pushTrail(world.entityTrails.get(data.id), data, 600);
      } else if (data.type === "snapshot") {
        applySnapshot(data);
        return;
      }
      draw();
    }

    function screen(point) {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      return {
        x: w / 2 + (point.x - world.center.x) * world.scale,
        y: h / 2 - (point.z - world.center.z) * world.scale
      };
    }

    function drawGrid(w, h) {
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--grid");
      ctx.lineWidth = 1;
      const step = Math.max(32, 250 * world.scale);
      const ox = ((-world.center.x * world.scale) % step + step) % step;
      const oy = ((world.center.z * world.scale) % step + step) % step;
      for (let x = ox; x < w; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = oy; y < h; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
    }

    function drawTrail(points, color, width) {
      if (!trailsEl.checked || points.length < 2) return;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      points.forEach((point, index) => {
        const p = screen(point);
        if (index === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.stroke();
    }

    function draw() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);
      drawGrid(w, h);

      drawTrail(world.playerTrail, "rgba(81, 183, 255, 0.55)", 2.5);
      for (const points of world.entityTrails.values()) {
        drawTrail(points, "rgba(255, 103, 95, 0.18)", 1);
      }

      const now = world.player ? world.player.t : 0;
      let active = 0;
      for (const entity of world.entities.values()) {
        const age = Math.max(0, now - entity.t);
        const isActive = age <= 5;
        if (isActive) active++;
        const p = screen(entity);
        ctx.fillStyle = isActive ? "#ff675f" : "#777f89";
        ctx.beginPath();
        ctx.arc(p.x, p.y, isActive ? 4.8 : 3.6, 0, Math.PI * 2);
        ctx.fill();
        if (isActive) {
          ctx.fillStyle = "#eef3f7";
          ctx.font = "11px Segoe UI";
          ctx.fillText(entity.hex || ("0x" + entity.id.toString(16)), p.x + 7, p.y - 6);
        }
      }

      if (world.player) {
        const p = screen(world.player);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(-world.player.rot);
        ctx.fillStyle = "#51b7ff";
        ctx.beginPath();
        ctx.moveTo(0, -11);
        ctx.lineTo(8, 8);
        ctx.lineTo(-8, 8);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      const total = world.entities.size;
      readoutEl.textContent = `${active}/${total} active`;
      const stats = world.stats || {};
      statusEl.textContent =
        `packets ${stats.packets || 0} | frames ${stats.app_frames || 0} | player ${stats.player_updates || 0} | entity ${stats.entity_updates || 0}`;
    }

    function connect() {
      const source = new EventSource("/events");
      source.onopen = () => {
        world.lastEventAt = performance.now();
        liveDot.classList.add("live");
      };
      source.onmessage = event => applyEvent(JSON.parse(event.data));
      source.addEventListener("snapshot", event => applySnapshot(JSON.parse(event.data)));
      source.onerror = () => {
        liveDot.classList.remove("live");
      };
    }

    setInterval(() => {
      if (performance.now() - world.lastEventAt > 3000) {
        liveDot.classList.remove("live");
      }
    }, 1000);

    canvas.addEventListener("wheel", event => {
      event.preventDefault();
      const factor = event.deltaY < 0 ? 1.12 : 0.89;
      world.scale = Math.min(2.5, Math.max(0.03, world.scale * factor));
      draw();
    }, { passive: false });

    let drag = null;
    canvas.addEventListener("pointerdown", event => {
      followEl.checked = false;
      drag = { x: event.clientX, y: event.clientY, center: { ...world.center } };
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointermove", event => {
      if (!drag) return;
      world.center.x = drag.center.x - (event.clientX - drag.x) / world.scale;
      world.center.z = drag.center.z + (event.clientY - drag.y) / world.scale;
      draw();
    });
    canvas.addEventListener("pointerup", () => {
      drag = null;
    });

    window.addEventListener("resize", resize);
    resize();
    connect();
  </script>
</body>
</html>
